name: Collect jobs

on:
  schedule:
    # Tuesday and Friday 13:07 UTC = 6:37 PM IST (Claude reviews the shortlist at 8:59 PM IST)
    - cron: "7 13 * * 2,5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Collect
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python collector.py

      - name: Save shortlist
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add output state
          git diff --cached --quiet || git commit -m "Shortlist $(date -u +%F)"
          git push
